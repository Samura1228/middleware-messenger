<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Middleware Messenger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
    }
    h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }
    #messages {
      width: 90%;
      max-width: 500px;
      height: 300px;
      overflow-y: auto;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 10px;
      background: #1e293b;
    }
    form {
      margin-top: 10px;
      display: flex;
      width: 90%;
      max-width: 500px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #334155;
      color: #e2e8f0;
    }
    button {
      padding: 10px 20px;
      border: none;
      margin-left: 10px;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <h1>💬 Middleware Messenger</h1>
  <div id="messages"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Введите сообщение..." />
    <button>Отправить</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    socket.on('chat message', (msg) => {
      const item = document.createElement('div');
      item.textContent = msg;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
